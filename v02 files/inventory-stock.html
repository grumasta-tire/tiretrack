<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TireTrack — Inventory Stock</title>
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-page="inventory-stock">

<div class="app-shell" id="appShell">
  <aside class="sidebar" id="sidebarMount"></aside>

  <main class="main">
    <div class="page-head">
      <h1>Inventory Stock</h1>
      <div class="subtitle">Every tire tracked by TireTrack, wherever it currently is.</div>
    </div>

    <div class="placeholder-note">This is a read-only view. Stock changes happen via <strong>Goods Receiving</strong>, <strong>Goods Delivery</strong>, <strong>Goods Return</strong>, or <strong>Stock Adjustment</strong>.</div>

    <div class="filter-bar">
      <div class="filter-field"><label>Warehouse</label>
        <select id="whsFilter" onchange="renderTable()">
          <option value="">All Warehouses</option>
        </select>
      </div>
      <div class="filter-field"><label>Item Status</label>
        <select id="statusFilter" onchange="renderTable()">
          <option value="">All</option>
          <option>Available</option>
          <option>Delivered</option>
          <option>Return</option>
        </select>
      </div>
    </div>

    <div class="card">
      <h2>Records <span class="badge badge-count" id="rowCount">0</span></h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>S/N</th><th>Brand</th><th>Tire Size</th><th>Pattern</th><th>Warehouse</th><th>Item Status</th><th>Receive Date</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="app-shell.js"></script>
<script src="db.js"></script>
<script>
  AppShell.init();
  let stock = [];

  function statusBadgeClass(status) {
    if (status === 'Available') return 'badge-closed';
    if (status === 'Return') return 'badge-open';
    return 'badge-count'; // Delivered
  }

  function renderTable() {
    const whs = document.getElementById('whsFilter').value;
    const status = document.getElementById('statusFilter').value;
    let rows = stock.filter(s => s.active);
    if (whs) rows = rows.filter(s => s.whs === whs);
    if (status) rows = rows.filter(s => s.item_status === status);
    document.getElementById('rowCount').textContent = rows.length;
    document.getElementById('tableBody').innerHTML = rows.map(s => `
      <tr><td class="mono">${s.sn}</td><td>${s.brand}</td><td>${s.tire_size}</td><td>${s.pattern}</td>
      <td class="mono">${s.whs}</td>
      <td><span class="badge ${statusBadgeClass(s.item_status)}">${s.item_status.toUpperCase()}</span></td>
      <td>${s.receive_date||''}</td></tr>`).join('');
  }

  (async function start() {
    const warehouses = await RefDB.warehouses();
    document.getElementById('whsFilter').insertAdjacentHTML('beforeend',
      warehouses.map(w => `<option value="${w.code}">${w.code} — ${w.name}</option>`).join(''));
    stock = await InventoryDB.list();
    renderTable();
  })();
</script>
</body>
</html>
